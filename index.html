<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Әлем елдері</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: жылы, көңілді, 3-сынып оқушысына арналған саяхат ойыны
   IDEA: саяхатшының паспорты мен глобус — әр ел бір «мөр»
   PICTURE: күлімдеген глобус кейіпкері, тестте ол қуанады/ойланады
   COLOUR and TYPE: мұхит көгі, күн сарысы, маржан қызыл; Nunito 900 (тақырыптар) + Nunito 600 (мәтін): дөңгелек, анық кирилл әріптері; үш тіл: қаз/рус/eng
   LAYOUT: жоғарыда екі үлкен бөлім-батырма, төменде карточкалар торы */
:root{color-scheme:light dark;
--bg:light-dark(#e9f6ff,#0c1d33);--ink:light-dark(#10264a,#eaf3ff);--soft:light-dark(#4c6286,#a9bfdf);
--sea:light-dark(#1f7ae0,#3d93f5);--sea2:light-dark(#0f5bb5,#1c4f97);--sun:#ffc93c;--coral:#ff6b5a;
--card:light-dark(#ffffff,#152b4a);--line:light-dark(#cfe3f7,#25426b);--ok:#20b46a;--bad:#ff5a4e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:600 18px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Nunito,system-ui,sans-serif;font-weight:900;line-height:1.12;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,14px)}
header{background:linear-gradient(160deg,var(--sea),var(--sea2));color:#fff;padding:22px 0 0;position:relative;overflow:hidden}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
header h1{font-size:clamp(36px,6vw,56px);font-weight:900}
header p{margin:6px 0 0;font-size:18px;opacity:.95;max-width:34em}
.hero-globe{width:clamp(96px,18vw,170px);height:auto;filter:drop-shadow(0 8px 0 rgba(0,0,0,.15));display:block}
.home{color:inherit;text-decoration:none;display:inline-block;border-radius:16px;cursor:pointer}
.home h1{transition:transform .15s}.home:hover h1{transform:translateY(-2px)}
.homeglobe svg{transition:transform .3s}.homeglobe:hover svg{transform:rotate(-12deg) scale(1.04)}
.home:focus-visible{outline:4px solid var(--sun);outline-offset:4px}
.navrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}
nav{display:flex;gap:10px;flex-wrap:wrap}
.langs{display:flex;gap:6px;background:rgba(255,255,255,.16);padding:6px;border-radius:22px;margin-bottom:10px}
.langs button{border:0;border-radius:16px;min-width:72px;min-height:52px;padding:6px 12px;background:transparent;color:#fff;font-family:Nunito,system-ui,sans-serif;font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;transition:transform .15s,background .15s}
.langs button small{font-family:Nunito,sans-serif;font-size:12px;font-weight:600;opacity:.9;margin-top:3px}
.langs button:hover{background:rgba(255,255,255,.18)}
.langs button[aria-pressed=true]{background:var(--sun);color:#10264a;box-shadow:0 4px 0 rgba(0,0,0,.18);transform:translateY(-2px)}
.gwrap{position:relative}
.bubble{position:absolute;top:-4px;right:calc(100% - 18px);background:#fff;color:#10264a;font-family:Nunito,system-ui,sans-serif;font-weight:700;font-size:17px;padding:8px 14px;border-radius:18px 18px 4px 18px;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.bubble.wave{animation:wave .6s}@keyframes wave{30%{transform:rotate(-8deg) scale(1.1)}60%{transform:rotate(5deg)}}
nav button{font-size:18px;border:0;border-radius:18px 18px 0 0;padding:14px 24px;font-family:Nunito,system-ui,sans-serif;font-weight:700;font-size:19px;background:rgba(255,255,255,.18);color:#fff;min-height:54px}
nav button[aria-selected=true]{background:var(--bg);color:var(--ink)}
main{padding:24px 0 60px}
.hidden{display:none!important}
/* Елдер тізімі */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.search{flex:1 1 260px;font-size:18px;padding:12px 16px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);min-height:52px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 11px;font-weight:700;font-size:14.5px;min-height:40px;white-space:nowrap;flex:none}
.chips.row{flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip[aria-pressed=true]{background:var(--sun);border-color:var(--sun);color:#10264a}
.count{color:var(--soft);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,44%),1fr));gap:14px}
.cc{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px;text-align:center;transition:transform .15s}
.cc:hover{transform:translateY(-3px);border-color:var(--sea)}
.cc .flag{margin:0 auto 10px}
.cc b{display:block;font-size:17px;line-height:1.2}
.cc span{display:block;color:var(--soft);font-size:15px;margin-top:4px}
.flag{display:block;width:100%;max-width:150px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.08);background:var(--line);display:grid;place-items:center;line-height:1.2;color:var(--soft);font-size:13px;text-align:center;padding:0}
.flag:empty{background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:shim 1.2s linear infinite}@keyframes shim{to{background-position:-200% 0}}
.note{margin:14px 0 0;background:var(--bg);border-radius:14px;padding:10px 14px;font-size:16px;text-align:left}
.fstat{background:var(--sun);color:#10264a;font-weight:700;border-radius:14px;padding:12px 16px;margin-bottom:16px}.fstat.err{background:var(--bad);color:#fff}
footer a{color:inherit}
.flag svg{width:100%;height:100%;display:block}
.empty{padding:40px;text-align:center;color:var(--soft);font-size:19px}
/* Модаль */
.modal{position:fixed;inset:0;background:rgba(5,20,45,.6);display:grid;place-items:center;padding:16px;z-index:20}
.box{background:var(--card);border-radius:24px;padding:24px;max-width:460px;width:100%;text-align:center;position:relative}
.box .flag{max-width:320px;margin:0 auto 18px;font-size:120px}
.box h2{font-size:clamp(28px,6vw,40px)}
.box .cap{font-size:20px;margin-top:10px}.box .cap b{color:var(--sea)}
.box .cont{display:inline-block;margin-top:12px;background:var(--bg);padding:6px 14px;border-radius:999px;font-weight:700;color:var(--soft)}
.x{position:absolute;top:10px;right:10px;width:46px;height:46px;border-radius:50%;border:0;background:var(--bg);font-size:24px;font-weight:700}
/* Тест */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px}
.mode{border:0;border-radius:24px;padding:24px;text-align:left;color:#10264a;display:grid;gap:10px;box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .15s}
.mode:hover{transform:translateY(-4px)}
.mode h2{font-size:clamp(23px,3.4vw,30px);font-weight:900}
.mode p{margin:0;font-size:17px}
.m1{background:var(--sun)}.m2{background:#8fe3b6}
.demo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo i{font-style:normal;background:#fff;border-radius:10px;padding:6px 10px;font-weight:700}
.who{display:grid;gap:8px;max-width:520px}.who .set{margin-top:4px}.name{font-size:20px;font-weight:700}.name.bad{border-color:var(--bad);animation:shake .4s}
.perr{color:var(--bad);font-weight:700}
.lbbox{margin-top:30px;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:clamp(16px,3vw,26px)}
.lbhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.lbhead h2{font-size:clamp(24px,4vw,32px)}
.lb{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;width:100%;text-align:left}
.lb li{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--bg);border-radius:14px;padding:8px 14px;font-size:18px}
.lb li.me{outline:3px solid var(--coral)}
.lb .rk{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:Nunito,system-ui,sans-serif;font-weight:700;background:var(--line)}
.lb .r1{background:#ffc93c;color:#10264a}.lb .r2{background:#c9d3de;color:#10264a}.lb .r3{background:#e0a26a;color:#10264a}
.lb b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb li:only-child b{white-space:normal}
.lb .of{color:var(--soft);font-weight:700;white-space:nowrap}
.lb strong{font-family:Nunito,system-ui,sans-serif;font-size:22px;color:var(--sea);white-space:nowrap}
.lbnote{color:var(--soft);font-size:14px;margin:12px 0 0}
.savest{font-weight:800;border-radius:12px;padding:8px 14px;font-size:16px}.savest:empty{display:none}.savest.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.savest.fail{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}.savest.send,.savest.local{color:var(--soft)}
.rank{font-size:22px;font-weight:700;background:var(--sun);color:#10264a;border-radius:16px;padding:10px 18px}
@media(max-width:600px){.lb li{grid-template-columns:38px minmax(0,1fr) auto;font-size:16px;padding:8px 10px}.lb .of{display:none}}
.set{display:block;margin:22px 0 10px;font-family:Nunito,system-ui,sans-serif;font-weight:700;font-size:20px}
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.prog{flex:1 1 200px;height:18px;background:var(--line);border-radius:999px;overflow:hidden}
.prog div{height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:999px;transition:width .3s}
.pill{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
.stage{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:clamp(16px,3vw,30px);display:grid;gap:18px}
.ask{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ask svg.mascot{width:clamp(64px,12vw,100px);height:auto}
.ask .lbl{color:var(--soft);font-weight:700;font-size:17px}
.ask h2{font-size:clamp(28px,6vw,48px);color:var(--sea)}
.bigflag{max-width:min(360px,100%);margin:0 auto;font-size:140px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{position:relative;border:4px solid var(--line);background:var(--bg);border-radius:20px;padding:12px 12px 12px 58px;text-align:left;font-weight:700;font-size:clamp(17px,2.4vw,22px);min-height:72px;display:flex;align-items:center;transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){border-color:var(--sea);transform:translateY(-2px)}
.opt .let{position:absolute;left:10px;top:50%;translate:0 -50%;width:38px;height:38px;border-radius:12px;background:var(--sea);color:#fff;display:grid;place-items:center;font-family:Nunito,system-ui,sans-serif}
.opt.fl{padding:46px 12px 12px;justify-content:center}
.opt.fl .let{top:8px;translate:0 0}
.opt.fl .flag{max-width:220px;font-size:80px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.ok .let{background:var(--ok)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card));animation:shake .4s}
.opt.no .let{background:var(--bad)}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700;font-size:20px}
.fb .good{color:var(--ok)}.fb .oops{color:var(--bad)}
.btn{border:0;border-radius:16px;padding:12px 24px;background:var(--coral);color:#fff;font-weight:700;font-size:19px;min-height:52px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:none}
.end{text-align:center;display:grid;gap:14px;justify-items:center}
.stars{font-size:clamp(48px,10vw,72px);letter-spacing:8px;color:var(--sun);line-height:1}
.stars .off{color:var(--line)}
.end h2{font-size:clamp(30px,6vw,46px)}
.review{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:10px;text-align:left}
.rv{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:8px}
.rv .flag{font-size:36px}
.rv span{color:var(--soft);font-size:15px;display:block}
.conf{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;z-index:30;pointer-events:none;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.12)}}
footer{color:var(--soft);font-size:14px;text-align:center;padding:0 0 30px}
main.wrap{padding-top:24px;padding-bottom:60px}
/* Пазл */
.pbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px}
.pstage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(16px,3vw,32px);align-items:start}
.board{display:grid;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--line);gap:3px;padding:3px;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 8px 0 rgba(0,0,0,.08)}
.board.done{gap:0;padding:0;box-shadow:0 0 0 5px var(--ok),0 8px 0 rgba(0,0,0,.08)}
.pc{position:relative;overflow:hidden;border-radius:6px;background:#eef3f9;cursor:grab;transition:transform .12s,box-shadow .12s}
.board.done .pc{border-radius:0;cursor:default}
.pc>svg{position:absolute;top:0;left:0;display:block}
.pc.sel{box-shadow:inset 0 0 0 4px var(--sun);transform:scale(.94);z-index:2}
.pc.okp::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px rgba(32,180,106,.55);border-radius:6px;pointer-events:none}
.board.done .pc.okp::after{display:none}
.pside{display:grid;gap:12px;align-content:start}
.pside .pill{justify-self:start}
.pside .how{color:var(--soft);font-weight:700;font-size:15px;margin:0}
.pacts{display:flex;flex-wrap:wrap;gap:8px}
.pq{display:grid;gap:10px}
.pq .lbl{font-weight:900;font-size:19px}
.pq .opts{grid-template-columns:minmax(0,1fr)}
.pq .opt{min-height:56px;font-size:18px}
@media(max-width:760px){.pstage{grid-template-columns:minmax(0,1fr)}}
/* Карточкалар */
.ctools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:16px}
.ctools .lbl{font-weight:800;color:var(--soft);font-size:15px}
.seg{display:flex;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:3px}
.seg button{border:0;background:transparent;border-radius:10px;padding:6px 12px;font-weight:800;font-size:15px;min-height:38px}
.seg button[aria-pressed=true]{background:var(--sea);color:#fff}
.tog{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;cursor:pointer;min-height:40px}
.tog input{width:22px;height:22px;accent-color:var(--sea)}
.cwrap{display:grid;gap:14px;justify-items:center;max-width:620px;margin:0 auto}
.fc{width:100%;perspective:1400px;cursor:pointer;border-radius:28px}
.fc-in{position:relative;height:clamp(300px,62vw,400px);transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;background:var(--card);border:4px solid var(--line);box-shadow:0 8px 0 rgba(0,0,0,.08);display:grid;place-items:center;align-content:center;gap:12px;padding:20px;text-align:center;overflow:auto}
.fc-front{background:linear-gradient(160deg,var(--card),var(--bg))}
.fc-back{transform:rotateY(180deg);border-color:var(--sun)}
.fc-face .flag{max-width:min(380px,82%);box-shadow:0 0 0 1px rgba(0,0,0,.12),0 6px 0 rgba(0,0,0,.1)}
.fc-back .flag{max-width:150px}
.fc-name{font-family:Nunito,system-ui,sans-serif;font-weight:900;font-size:clamp(28px,6vw,46px);line-height:1.1;color:var(--sea)}
.fc-cap{font-size:clamp(18px,3vw,22px)}.fc-cap b{color:var(--ink)}
.fc-hint{color:var(--soft);font-weight:800;font-size:15px}
.fc .cont{display:inline-block;background:var(--bg);padding:4px 12px;border-radius:10px;font-weight:800;color:var(--soft);font-size:14px}
.fc .note{margin:0;font-size:14px;max-width:440px}
.say{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:10px 16px;min-height:48px;background:var(--sea);color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--sea2)}
.say svg{width:22px;height:22px;flex:none}
.say.small{background:var(--card);color:var(--sea);border:2px solid var(--line);box-shadow:none}
.say.on{animation:pulse .8s infinite}@keyframes pulse{50%{transform:scale(1.06)}}
.sayrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.vnote{background:color-mix(in srgb,var(--sun) 35%,var(--card));border-radius:12px;padding:8px 14px;font-size:14px;font-weight:700;text-align:center;max-width:560px}
.cnav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%}
.cnav .pill{text-align:center}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mark .btn{width:100%}.mark .k{background:var(--ok)}.mark .r{background:var(--coral)}
.cstats{color:var(--soft);font-weight:800;font-size:15px;text-align:center}
.cempty{padding:40px 20px;text-align:center;font-size:20px;font-weight:800}
@media(max-width:600px){.ctools{gap:8px}.cnav .btn{padding:10px 14px;font-size:17px}}
@media(max-width:600px){.top{grid-template-columns:minmax(0,1fr) 84px}.navrow{flex-direction:column-reverse;align-items:stretch}nav{width:100%}.langs{margin:0;justify-content:center}.langs button{flex:1}.bubble{font-size:13px;padding:5px 10px;top:auto;bottom:-8px;right:50%;translate:50% 0;border-radius:14px}nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:10px}nav button{padding:10px 6px;font-size:16px;line-height:1.15;min-height:48px;border-radius:14px}.opt{min-height:64px;padding-left:52px}.opt .let{width:34px;height:34px}.opt.fl{padding:42px 8px 8px}.ask{grid-template-columns:minmax(0,1fr)}.ask svg.mascot{display:none}.qbar .pill{font-size:15px}}
@media(max-width:360px){.opts{gap:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="globe" viewBox="0 0 200 200">
  <ellipse cx="100" cy="188" rx="58" ry="8" fill="rgba(0,0,0,.18)"/>
  <circle cx="100" cy="96" r="82" fill="#2f8cf0"/>
  <path d="M40 60c18-18 40-14 46-2s-8 20 4 30 26 0 28 14-14 22-30 20-30-14-40-30-20-22-8-32z" fill="#5fd38d"/>
  <path d="M128 34c16 4 30 18 34 34-10 2-18-6-26-4s-12 12-22 8 4-22 14-38z" fill="#5fd38d"/>
  <path d="M120 130c14-6 30 0 32 10s-12 22-24 22-20-26-8-32z" fill="#5fd38d"/>
  <circle cx="100" cy="96" r="82" fill="none" stroke="#0f5bb5" stroke-width="6"/>

/* Деректер: үш тілдегі атау, астана және түсініктеме */
const C=RAW.split('\n').map(l=>{const[k,c,n,cap,note]=l.split('|');return{k,c,nm:{kk:n},cp:{kk:cap},nt:note?{kk:note,...(NOTES[c]||{})}:null}});
const byC=Object.fromEntries(C.map(x=>[x.c,x]));
RUEN.split('\n').forEach(l=>{const[c,rn,rc,en,ec]=l.split('|');const x=byC[c];if(x){x.nm.ru=rn;x.cp.ru=rc;x.nm.en=en;x.cp.en=ec}});

let SET=null,flagState='loading';

 const w=ic.width||SET.width||640,h=ic.height||SET.height||480;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${ic.left||0} ${ic.top||0} ${w} ${h}" aria-hidden="true">${ic.body}</svg>`};
const flagInner=c=>SET?svgOf(c):flagState==='fail'?`<small>${t('fNo')}</small>`:'';

const flagsReady=import('https://cdn.jsdelivr.net/npm/@iconify-json/flag@1.2.15/+esm').then(m=>{SET=m.icons;flagState='ok';refreshFlags();fstat();if(typeof PZ!=='undefined'&&PZ)renderPuzzle()})
 .catch(()=>{flagState='fail';refreshFlags();fstat();if(typeof PZ!=='undefined'&&PZ)renderPuzzle()});

/* Тізім */
let cont='all';
const chipRow=(el,get,onPick)=>{el.innerHTML=['all','as','eu','af','na','sa','oc'].map(k=>`<button class="chip" data-k="${k}" aria-pressed="${k===get()}">${t('c_'+k)}</button>`).join('');
 el.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;el.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));onPick(b.dataset.k)}};
const plural=n=>L==='kk'?n+' ел':L==='en'?n+(n===1?' country':' countries'):n+' '+(n%10===1&&n%100!==11?'страна':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'страны':'стран');
const renderList=()=>{const q=$('q').value.trim().toLowerCase(),cl=coll();
 const list=C.filter(x=>(cont==='all'||x.k===cont)&&(!q||LANGS.some(l=>x.nm[l].toLowerCase().includes(q)||x.cp[l].toLowerCase().includes(q)))).sort((a,b)=>cl.compare(N(a),N(b)));
 $('cnt').textContent=plural(list.length);
 $('grid').innerHTML=list.length?list.map(x=>`<button class="cc" data-c="${x.c}">${flag(x.c)}<b>${esc(N(x))}</b><span>${t('capital')}: ${esc(CAP(x))}</span></button>`).join(''):`<div class="empty">${t('empty')}</div>`};
$('q').addEventListener('input',renderList);
$('grid').onclick=e=>{const b=e.target.closest('.cc');if(b)openCard(b.dataset.c)};
let openC=null;
/* Дыбыстау: браузердің SpeechSynthesis дауыстары. Таңдалған тілдің дауысы жоқ болса, басқа тілдің дауысымен оқымаймыз. */
const VL={kk:'kk-KZ',ru:'ru-RU',en:'en-US'};
const hasTTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
let voices=[];
const loadVoices=()=>{try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}};
if(hasTTS){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',()=>{loadVoices();voiceNotes()})}catch(e){}}
const pickVoice=l=>{const ok=voices.filter(v=>{const lg=(v.lang||'').toLowerCase().replace('_','-');return lg.startsWith(l)||(l==='kk'&&/kazakh|қазақ/i.test(v.name))});
 if(!ok.length)return null;const sc=v=>(/natural|neural|online/i.test(v.name)?4:0)+(/google/i.test(v.name)?2:0)+((v.lang||'').toLowerCase().replace('_','-')===VL[l].toLowerCase()?1:0);
 return ok.sort((a,b)=>sc(b)-sc(a))[0]};
const voiceMsg=()=>SHEETS_URL?'':!hasTTS?t('noSpeech'):voices.length&&!pickVoice(L)?t('noVoice'):'';
const noteAll=m=>document.querySelectorAll('[data-vnote]').forEach(n=>{n.textContent=m;n.classList.toggle('hidden',!m)});
const voiceNotes=()=>document.querySelectorAll('[data-vnote]').forEach(n=>{const m=voiceMsg();n.textContent=m;n.classList.toggle('hidden',!m)});
let sayingBtn=null;
const stopSpeak=()=>{try{if(hasTTS)speechSynthesis.cancel()}catch(e){}try{AU.pause()}catch(e){}if(sayingBtn){sayingBtn.classList.remove('on');sayingBtn=null}};
const speak=(text,btn)=>{if(!hasTTS){noteAll(t('noSpeech'));return}loadVoices();const v=pickVoice(L);
 if(!v&&(voices.length||L==='kk')){noteAll(t('noVoice'));return}
 stopSpeak();const u=new SpeechSynthesisUtterance(text);u.lang=VL[L];if(v)u.voice=v;u.rate=.85;u.pitch=1;
 if(btn){sayingBtn=btn;btn.classList.add('on');u.onend=u.onerror=()=>{btn.classList.remove('on');if(sayingBtn===btn)sayingBtn=null}}
 try{speechSynthesis.speak(u)}catch(e){voiceNotes()}};
const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const sayBtns=c=>`<button class="say" data-say="n" data-c="${c}">${SPK}${t('sayName')}</button><button class="say small" data-say="c" data-c="${c}">${SPK}${t('sayCap')}</button>`;
/* ElevenLabs дауыстары: Google Apps Script (Code.gs) арқылы келеді, кілт сайтта жоқ. Болмаса — браузер дауысы. */
const AU=new Audio();AU.preload='auto';const AUD={};let auUnlocked=false;
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
document.addEventListener('pointerdown',()=>{if(auUnlocked)return;auUnlocked=true;try{AU.src=SILENT;AU.play().catch(()=>{})}catch(e){}},{capture:true});
const playB64=(b64,btn)=>{AU.onended=AU.onerror=()=>{if(btn)btn.classList.remove('on')};AU.src='data:audio/mpeg;base64,'+b64;if(btn){sayingBtn=btn;btn.classList.add('on')}AU.play().catch(()=>{if(btn)btn.classList.remove('on')})};
const speakId=(c,kind,btn)=>{const x=byC[c];if(!x)return;const text=kind==='c'?CAP(x):N(x);noteAll('');
 if(!SHEETS_URL){speak(text,btn);return}
 stopSpeak();const lang=L,key=lang+'|'+c+'-'+kind;
 if(AUD[key]){playB64(AUD[key],btn);return}
 if(btn){sayingBtn=btn;btn.classList.add('on')}const mine=btn;
 fetch(SHEETS_URL+'?tts='+lang+'&id='+encodeURIComponent(c+'-'+kind)).then(r=>r.json()).then(d=>{if(!d||!d.ok||!d.b64)throw new Error(d&&d.error);AUD[key]=d.b64;if(sayingBtn===mine&&L===lang)playB64(d.b64,mine)})
  .catch(()=>{if(mine)mine.classList.remove('on');if(sayingBtn===mine&&L===lang)speak(text,mine)})};
const sayIt=b=>speakId(b.dataset.c,b.dataset.say==='c'?'c':'n',b);

/* Карточкалар */
let known=new Set(),again=new Set();
try{known=new Set(JSON.parse(localStorage.getItem('alem-known')||'[]'));again=new Set(JSON.parse(localStorage.getItem('alem-again')||'[]'))}catch(e){}
const saveMarks=()=>{try{localStorage.setItem('alem-known',JSON.stringify([...known]));localStorage.setItem('alem-again',JSON.stringify([...again]))}catch(e){}};
let cc='all',cface='flag',cmode='all',corder=null,cidx=0,cflip=false,cauto=false;
try{cauto=localStorage.getItem('alem-auto')==='1'}catch(e){}
$('cauto').checked=cauto;
const deck=()=>{let d=C.filter(x=>cc==='all'||x.k===cc);if(cmode==='learn')d=d.filter(x=>!known.has(x.c));
 if(corder){const o=new Map(corder.map((c,i)=>[c,i]));d.sort((a,b)=>o.get(a.c)-o.get(b.c))}else{const cl=coll();d.sort((a,b)=>cl.compare(N(a),N(b)))}return d};
const renderCards=(speakNow)=>{const d=deck(),base=C.filter(x=>cc==='all'||x.k===cc);
 $('cmlearn').textContent=t('deckLearn',{n:base.filter(x=>!known.has(x.c)).length});
 const kn=base.filter(x=>known.has(x.c)).length,rp=base.filter(x=>again.has(x.c)).length;
 if(!d.length){$('cwrap').innerHTML=`<div class="cempty">${t('cEmpty')}</div><div class="cstats">${t('cStats',{k:kn,r:rp})}</div><button class="chip" id="creset">${t('cReset')}</button>`;return}
 if(cidx>=d.length)cidx=0;if(cidx<0)cidx=d.length-1;const x=d[cidx];
 const front=cface==='flag'?`${flag(x.c)}<div class="fc-hint">${t('cHint')}</div>`:`<div class="fc-name">${esc(N(x))}</div><div class="fc-hint">${t('cHint')}</div>`;
 const back=`${flag(x.c)}<div class="fc-name">${esc(N(x))}</div><div class="fc-cap">${t('capital')}: <b>${esc(CAP(x))}</b></div><span class="cont">${t('c_'+x.k)}</span>${NT(x)?`<p class="note">${esc(NT(x))}</p>`:''}`;
 $('cwrap').innerHTML=`<div class="fc${cflip?' flip':''}" id="fc" tabindex="0" role="button" aria-label="${t('cHint')}"><div class="fc-in"><div class="fc-face fc-front" aria-hidden="${cflip}">${front}</div><div class="fc-face fc-back" aria-hidden="${!cflip}">${back}</div></div></div>
  <div class="sayrow">${sayBtns(x.c)}</div><div class="vnote hidden" data-vnote></div>
  <div class="cnav"><button class="btn alt" id="cprev">${t('cPrev')}</button><span class="pill">${cidx+1} / ${d.length}</span><button class="btn alt" id="cnext">${t('cNext')}</button></div>
  <div class="mark"><button class="btn r" id="cagain">${t('notYet')}</button><button class="btn k" id="cknow">${t('know')}</button></div>
  <div class="cstats">${t('cStats',{k:kn,r:rp})}</div><button class="chip" id="creset">${t('cReset')}</button>`;
 voiceNotes();
 if(speakNow&&cauto&&(cflip||cface==='name'))speakId(x.c,'n',document.querySelector('#cwrap .say'))};
const flipCard=()=>{const f=$('fc');if(!f)return;cflip=!cflip;f.classList.toggle('flip',cflip);f.querySelector('.fc-front').setAttribute('aria-hidden',cflip);f.querySelector('.fc-back').setAttribute('aria-hidden',!cflip);
 if(cflip&&cauto){const d=deck();if(d[cidx])speakId(d[cidx].c,'n',document.querySelector('#cwrap .say'))}};
const goCard=st=>{stopSpeak();cidx+=st;cflip=false;renderCards(true)};
const markCard=k=>{const d=deck(),x=d[cidx];if(!x)return;if(k){known.add(x.c);again.delete(x.c)}else{again.add(x.c);known.delete(x.c)}saveMarks();stopSpeak();cflip=false;if(!(k&&cmode==='learn'))cidx++;renderCards(true)};
$('cwrap').onclick=e=>{const b=e.target.closest('button');
 if(b){if(b.classList.contains('say'))sayIt(b);else if(b.id==='cprev')goCard(-1);else if(b.id==='cnext')goCard(1);else if(b.id==='cknow')markCard(true);else if(b.id==='cagain')markCard(false);
  else if(b.id==='creset'){known.clear();again.clear();saveMarks();cidx=0;cflip=false;renderCards()}return}
 if(e.target.closest('#fc'))flipCard()};
$('cface').onclick=e=>{const b=e.target.closest('button');if(!b)return;cface=b.dataset.f;$('cface').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));cflip=false;renderCards(true)};
$('cmode').onclick=e=>{const b=e.target.closest('button');if(!b)return;cmode=b.dataset.m;$('cmode').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));cidx=0;cflip=false;renderCards()};
$('cshuf').onclick=()=>{corder=shuffleC(C.map(x=>x.c));cidx=0;cflip=false;renderCards(true)};
$('cauto').onchange=()=>{cauto=$('cauto').checked;try{localStorage.setItem('alem-auto',cauto?'1':'0')}catch(e){}};
const shuffleC=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const r=Math.random()*(j+1)|0;[a[j],a[r]]=[a[r],a[j]]}return a};

/* Пазл: ту бөліктерге бөлінеді, екі бөлікті ауыстыра отырып жинайды, сосын 4 елдің ішінен табады */
let PZ=null,pc_='all',pn=3,pScore=0,pSolved=0,pSel=null;
const newPuzzle=()=>{const pool=C.filter(x=>pc_==='all'||x.k===pc_);const a=pool[Math.random()*pool.length|0];
 const n=pn*pn;let ord;do{ord=shuffleC([...Array(n).keys()])}while(ord.every((v,i)=>v===i));
 PZ={a,ord,moves:0,solved:false,picked:null,opts:shuffleC([a,...shuffleC(pool.filter(x=>x!==a)).slice(0,3)]),pi:Math.random()*5|0};pSel=null;renderPuzzle()};
const pzSolvedNow=()=>PZ.ord.every((v,i)=>v===i);
const renderBoard=()=>{const b=$('board');const n=pn;b.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;b.classList.toggle('done',PZ.solved);
 const svg=SET?svgOf(PZ.a.c):'';
 b.innerHTML=PZ.ord.map((piece,slot)=>{const r=piece/n|0,c=piece%n;
  return `<div class="pc${piece===slot?' okp':''}${pSel===slot?' sel':''}" data-s="${slot}">${svg.replace('<svg ',`<svg preserveAspectRatio="none" style="width:${n*100}%;height:${n*100}%;left:${-c*100}%;top:${-r*100}%" `)}</div>`}).join('')};
const renderPuzzle=()=>{if(!PZ)return;$('pscore').textContent=t('points',{n:pScore});$('psolved').textContent=t('pzSolved',{n:pSolved});
 if(flagState!=='ok'){$('board').innerHTML='';$('pside').innerHTML=`<p class="how">${flagState==='fail'?t('fFail'):t('fLoad')}</p>`;return}
 renderBoard();const right=PZ.opts.indexOf(PZ.a);
 if(!PZ.solved){$('pside').innerHTML=`<p class="how">${t('pzHow')}</p><span class="pill">${t('moves',{n:PZ.moves})}</span><div class="pacts"><button class="btn alt" id="phint">${t('pzHint')}</button><button class="btn alt" id="pskip">${t('pzSkip')}</button></div>`;return}
 let fb='';
 if(PZ.picked!=null){fb=PZ.picked===right?`<div class="fb"><span class="good">${esc(fill(T[L].praise[PZ.pi],{n:player||''}).replace(/,\s*!/,'!'))} ${esc(t('isC',{c:N(PZ.a)}))} ${esc(t('capOf',{c:CAP(PZ.a)}))}</span></div>`:`<div class="fb"><span class="oops">${esc(t('wrong',{l:'ABCD'[right],c:N(PZ.a)}))}</span></div>`;
  fb+=`<div class="sayrow" style="justify-content:flex-start">${sayBtns(PZ.a.c)}</div><div class="vnote hidden" data-vnote></div><button class="btn" id="pnext">${t('pzNext')}</button>`}
 $('pside').innerHTML=`<div class="pq"><div class="lbl">${t('pzDone')}</div><div class="opts">${PZ.opts.map((o,k)=>`<button class="opt${PZ.picked!=null&&k===right?' ok':''}${PZ.picked===k&&k!==right?' no':''}" data-k="${k}" ${PZ.picked!=null?'disabled':''}><span class="let">${'ABCD'[k]}</span>${esc(N(o))}</button>`).join('')}</div>${fb}</div><span class="pill">${t('moves',{n:PZ.moves})}</span>`;
 voiceNotes()};
const pzSwap=(i,j)=>{if(PZ.solved||i===j)return;[PZ.ord[i],PZ.ord[j]]=[PZ.ord[j],PZ.ord[i]];PZ.moves++;pSel=null;
 if(pzSolvedNow()){PZ.solved=true;beep(1);confetti()}renderPuzzle()};
let pDown=null;
$('board').addEventListener('pointerdown',e=>{const pcE=e.target.closest('.pc');if(!pcE||PZ.solved)return;e.preventDefault();pDown=+pcE.dataset.s;try{$('board').releasePointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointerup',e=>{if(pDown==null)return;const from=pDown;pDown=null;const el=document.elementFromPoint(e.clientX,e.clientY);const pcE=el&&el.closest&&el.closest('#board .pc');
 if(!pcE)return;const to=+pcE.dataset.s;
 if(to!==from){pzSwap(from,to);return}
 if(pSel==null){pSel=from;renderBoard()}else if(pSel===from){pSel=null;renderBoard()}else pzSwap(pSel,from)});
$('pside').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='pskip'){stopSpeak();newPuzzle()}
 else if(b.id==='pnext'){stopSpeak();newPuzzle()}
 else if(b.id==='phint'){const i=PZ.ord.findIndex((v,k)=>v!==k);if(i>=0){const j=PZ.ord.indexOf(i);pzSwap(i,j)}}
 else if(b.classList.contains('say'))sayIt(b);
 else if(b.classList.contains('opt')&&PZ.picked==null){PZ.picked=+b.dataset.k;const ok=PZ.opts[PZ.picked]===PZ.a;
  if(ok){pScore+=10;pSolved++;beep(1);confetti()}else{beep(0)}renderPuzzle();if(ok&&cauto)speakId(PZ.a.c,'n',document.querySelector('#pside .say'))}};
$('plevel').onclick=e=>{const b=e.target.closest('button');if(!b)return;pn=+b.dataset.n;$('plevel').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));newPuzzle()};
const openCard=c=>{openC=c;const x=byC[c];$('mbox').innerHTML=`<button class="x" id="mx" aria-label="${t('close')}">×</button>${flag(c)}<h2>${esc(N(x))}</h2><div class="cap">${t('capital')}: <b>${esc(CAP(x))}</b></div><div class="cont">${t('c_'+x.k)}</div>${NT(x)?`<p class="note">${esc(NT(x))}</p>`:''}<div class="sayrow" style="margin-top:14px">${sayBtns(c)}</div><div class="vnote hidden" data-vnote></div>`;$('modal').classList.remove('hidden');$('mx').focus()};
const closeModal=()=>{openC=null;stopSpeak();$('modal').classList.add('hidden')};
$('modal').onclick=e=>{const sb=e.target.closest('.say');if(sb){sayIt(sb);return}if(e.target.id==='modal'||e.target.id==='mx')closeModal()};

/* Бөлімдер */
const show=v=>{if(v!=='cards')stopSpeak();['list','cards','puzzle','quiz'].forEach(n=>{$('view-'+n).classList.toggle('hidden',n!==v);$('tab-'+n).setAttribute('aria-selected',n===v)})};
$('tab-list').onclick=()=>show('list');$('tab-cards').onclick=()=>{show('cards');renderCards()};$('tab-puzzle').onclick=()=>{show('puzzle');if(!PZ)newPuzzle();else renderPuzzle()};
const goHome=e=>{e.preventDefault();closeModal();show('list');$('q').value='';cont='all';$('chips').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.k==='all'));renderList();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})};
document.querySelectorAll('.home').forEach(a=>a.addEventListener('click',goHome));$('tab-quiz').onclick=()=>show('quiz');

/* Тест */
let qc='all',qN=10,mode=1,Q=[],i=0,score=0,streak=0,best=0,wrong=[],locked=false,endRes=null;
const renderQnum=()=>{$('qnum').innerHTML=[5,10,20,30].map(n=>`<button class="chip" data-n="${n}" aria-pressed="${n===qN}">${t('qnum',{n})}</button>`).join('')};
$('qnum').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;$('qnum').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));qN=+b.dataset.n};
const shuffle=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const r=Math.random()*(j+1)|0;[a[j],a[r]]=[a[r],a[j]]}return a};
let ac=null;
const beep=ok=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const tm=ac.currentTime;(ok?[523,659,784]:[220,180]).forEach((f,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type=ok?'triangle':'square';g.gain.setValueAtTime(.12,tm+k*.1);g.gain.exponentialRampToValueAtTime(.001,tm+k*.1+.18);o.connect(g).connect(ac.destination);o.start(tm+k*.1);o.stop(tm+k*.1+.2)})}catch(e){}};
const confetti=()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const cols=['#ffc93c','#ff6b5a','#20b46a','#1f7ae0','#b26bff'];for(let k=0;k<26;k++){const d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=cols[k%5];d.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1900)}};
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(+b.dataset.mode));
let player='';try{player=localStorage.getItem('alem-name')||''}catch(e){}$('pname').value=player;
$('pname').addEventListener('input',()=>{$('pname').classList.remove('bad');$('perr').classList.add('hidden')});
const start=m=>{const nm=$('pname').value.trim().replace(/\s+/g,' ');if(!nm){$('pname').classList.remove('bad');void $('pname').offsetWidth;$('pname').classList.add('bad');$('perr').classList.remove('hidden');$('pname').scrollIntoView({block:'center'});$('pname').focus({preventScroll:true});return}
 player=nm;try{localStorage.setItem('alem-name',nm)}catch(e){}
 if(flagState!=='ok'){$('fstat').dataset.force=1;fstat();$('fstat').classList.remove('hidden');$('fstat').scrollIntoView({block:'center'});if(start.w)return;start.w=1;flagsReady.then(()=>{delete $('fstat').dataset.force;fstat();if(flagState==='ok')start(m)});return}
 mode=m;const pool=C.filter(x=>qc==='all'||x.k===qc);Q=shuffle(pool).slice(0,Math.min(qN,pool.length)).map(a=>({a,opts:shuffle([a,...shuffle(pool.filter(x=>x!==a)).slice(0,3)]),picked:null,pi:Math.random()*5|0}));
 i=0;score=0;streak=0;best=0;wrong=[];endRes=null;$('q-start').classList.add('hidden');$('q-end').classList.add('hidden');$('q-play').classList.remove('hidden');ask()};
const bar=()=>{$('pn').textContent=t('player',{n:player});$('qn').textContent=`${i+1} / ${Q.length}`;$('pg').style.width=(i/Q.length*100)+'%';$('sc').textContent=t('points',{n:score*10});$('st').textContent=t('streak',{n:streak})};
const renderQ=()=>{const q=Q[i];if(!q)return;bar();
 $('prompt').innerHTML=mode===1?`<div class="lbl">${t('q1')}</div><h2>${esc(N(q.a))}</h2>`:`<div class="lbl">${t('q2')}</div>${flag(q.a.c,'bigflag')}`;
 $('opts').innerHTML=q.opts.map((o,k)=>`<button class="opt ${mode===1?'fl':''}" data-k="${k}"><span class="let">${'ABCD'[k]}</span>${mode===1?flag(o.c):esc(N(o))}</button>`).join('');
 const right=q.opts.indexOf(q.a);
 if(q.picked==null){$('msg').innerHTML='';$('next').classList.add('hidden');return}
 const btns=[...$('opts').children];btns.forEach(b=>b.disabled=true);btns[right].classList.add('ok');
 if(q.picked===right){$('msg').innerHTML=`<span class="good">${esc(fill(T[L].praise[q.pi],{n:player}))}${mode===1?'':' '+esc(t('isC',{c:N(q.a)}))} ${esc(t('capOf',{c:CAP(q.a)}))}</span>`}
 else{btns[q.picked].classList.add('no');$('msg').innerHTML=`<span class="oops">${esc(t('wrong',{l:'ABCD'[right],c:N(q.a)}))}</span>`;$('next').classList.remove('hidden')}};
const ask=()=>{locked=false;renderQ();$('opts').querySelector('.opt').focus({preventScroll:true})};
const pick=k=>{if(locked)return;locked=true;const q=Q[i],right=q.opts.indexOf(q.a);q.picked=k;
 if(k===right){score++;streak++;best=Math.max(best,streak);beep(1);confetti();renderQ();$('opts').children[k].classList.add('pop');const at=i;setTimeout(()=>{if(locked&&i===at)next()},1500)}
 else{streak=0;wrong.push(q.a);beep(0);renderQ();$('next').focus()}};
$('opts').onclick=e=>{const b=e.target.closest('.opt');if(b)pick(+b.dataset.k)};
const next=()=>{if(!locked)return;i++;if(i<Q.length)ask();else finish()};
$('next').onclick=next;
$('quit').onclick=()=>{locked=false;$('q-play').classList.add('hidden');$('q-start').classList.remove('hidden')};

/* Үздік ойыншылар */
let LB=[];try{LB=JSON.parse(localStorage.getItem('alem-lb')||'[]');if(!Array.isArray(LB))LB=[]}catch(e){LB=[]}
const saveLB=()=>{try{localStorage.setItem('alem-lb',JSON.stringify(LB))}catch(e){}};
const cmp=(a,b)=>b.pts-a.pts||b.pct-a.pct||b.best-a.best||a.t-b.t;
const key=n=>String(n).toLocaleLowerCase('kk');
/* Google Sheets: Apps Script веб-қосымшасының сілтемесін осында қойыңыз (бос болса, нәтижелер тек осы құрылғыда сақталады) */
const SHEETS_URL='';
let RB=null,where='wLocal',save='';
const sorted=m=>(RB||LB).filter(r=>r.m===m).sort(cmp);
const upsert=(arr,r)=>{const old=arr.find(x=>x.m===r.m&&key(x.n)===key(r.n));if(!old){arr.push(r);return true}if(cmp(r,old)<0){Object.assign(old,r);return true}return false};
const takeRemote=d=>{if(d&&d.top){RB=[...(d.top[1]||[]),...(d.top[2]||[])];where='wSheets';$('lbclear').classList.add('hidden');renderLB();const el=$('endlb');if(el)el.innerHTML=lbRows(mode,player)}};
const loadRemote=()=>{if(!SHEETS_URL)return;fetch(SHEETS_URL).then(r=>r.json()).then(takeRemote).catch(()=>{where='wFail';renderLB()})};
const setSave=v=>{save=v;const el=$('savest');if(el){el.className='savest '+v;el.textContent=t('sv_'+v)}};
const post=r=>{setSave('send');return fetch(SHEETS_URL,{method:'POST',body:JSON.stringify({...r,cont:T.kk['c_'+qc],lang:L})}).then(x=>x.json()).then(d=>{if(!d||!d.ok)throw new Error(d&&d.error||'bad');setSave('ok');takeRemote(d)}).catch(e=>{setSave('fail');throw e})};
const record=r=>{let rec;if(!SHEETS_URL)save='local';if(RB){rec=upsert(RB,r);post(r).catch(()=>{upsert(LB,r);saveLB()})}
 else{rec=upsert(LB,r);saveLB();if(SHEETS_URL)post(r).catch(()=>{})}
 renderLB();return{rank:sorted(r.m).findIndex(x=>key(x.n)===key(r.n))+1,rec}};
const lbRows=(m,me)=>{const rows=sorted(m).slice(0,10);if(!rows.length)return `<li><span class="rk">–</span><b>${t('lbEmpty')}</b></li>`;
 return rows.map((r,k)=>`<li class="${me&&key(r.n)===key(me)?'me':''}"><span class="rk ${k<3?'r'+(k+1):''}">${k+1}</span><b>${esc(r.n)}</b><span class="of">${r.ok}/${r.tot}</span><strong>${r.pts}</strong></li>`).join('')};
let lbm=1,clr=false;
const renderLB=()=>{$('lb').innerHTML=lbRows(lbm,player);$('lbwhere').textContent=t(where);$('lbclear').textContent=clr?t('clear2'):t('clear')};
$('lbtabs').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;$('lbtabs').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));lbm=+b.dataset.m;renderLB()};
$('lbclear').onclick=()=>{if(!clr){clr=true;renderLB();setTimeout(()=>{clr=false;renderLB()},4000);return}clr=false;LB=[];saveLB();renderLB()};

const finish=()=>{locked=false;$('q-play').classList.add('hidden');const p=score/Q.length,s=p>=.9?3:p>=.6?2:p>0?1:0;if(s>=2)confetti();
 const res=record({n:player,m:mode,pts:score*10,ok:score,tot:Q.length,pct:Math.round(p*100),best,t:Date.now()});
 endRes={s,res};renderEnd();$('q-end').classList.remove('hidden')};
const renderEnd=()=>{if(!endRes)return;const{s,res}=endRes;
 $('q-end').innerHTML=`<svg class="hero-globe" viewBox="0 0 200 200" aria-hidden="true"><use href="#globe"/></svg><div class="stars">${[0,1,2].map(k=>`<span class="${k<s?'':'off'}">★</span>`).join('')}</div><h2>${esc(fill(T[L].end[s],{n:player}))}</h2>
 <div style="font-size:21px;font-weight:700">${esc(t('sum',{t:Q.length,o:score,b:best}))}</div>
 <div class="rank">${esc(t('rank',{p:score*10,r:res.rank}))}${res.rec?t('rec'):''}</div>
 <div id="savest" class="savest ${save}">${save?t('sv_'+save):''}</div>
 <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" id="again">${t('again')}</button><button class="btn alt" id="menu">${t('menu')}</button></div>
 ${wrong.length?`<div class="set">${t('review')}</div><div class="review">${wrong.map(x=>`<div class="rv">${flag(x.c)}<div><b>${esc(N(x))}</b><span>${t('capital')}: ${esc(CAP(x))}</span></div></div>`).join('')}</div>`:''}
 <div class="set">${t('lbTitle')} — ${t(mode===1?'lb1':'lb2')}</div><ol class="lb" id="endlb">${lbRows(mode,player)}</ol>`;
 $('again').onclick=()=>start(mode);$('menu').onclick=()=>{endRes=null;$('q-end').classList.add('hidden');$('q-start').classList.remove('hidden')}};

/* Тіл ауыстыру */
const applyLang=()=>{document.documentElement.lang=L;document.title=t('title');
 document.querySelectorAll('[data-t]').forEach(e=>{const v=t(e.dataset.t,{n:C.length});if(typeof v==='string')e.innerHTML=v});
 document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
 document.querySelectorAll('[data-ta]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.ta)));
 document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L));
 const bub=document.querySelector('.bubble');bub.classList.remove('wave');void bub.offsetWidth;bub.classList.add('wave');
 chipRow($('chips'),()=>cont,k=>{cont=k;renderList()});chipRow($('qchips'),()=>qc,k=>qc=k);chipRow($('pchips'),()=>pc_,k=>{pc_=k;newPuzzle()});chipRow($('cchips'),()=>cc,k=>{cc=k;cidx=0;cflip=false;renderCards()});renderQnum();stopSpeak();renderCards();renderPuzzle();
 fstat();renderList();renderLB();refreshFlags();
 if(openC)openCard(openC);
 if(!$('q-play').classList.contains('hidden'))renderQ();
 if(!$('q-end').classList.contains('hidden'))renderEnd()};
document.querySelector('.langs').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.lang===L)return;L=b.dataset.lang;try{localStorage.setItem('alem-lang',L)}catch(e){}applyLang()};
applyLang();loadRemote();$('foot3').classList.toggle('hidden',!SHEETS_URL);

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();
 if(!$('view-cards').classList.contains('hidden')&&$('modal').classList.contains('hidden')&&e.target.tagName!=='INPUT'){
  if(e.key==='ArrowRight'){goCard(1);return}if(e.key==='ArrowLeft'){goCard(-1);return}
  if((e.key===' '||e.key==='Enter')&&(!e.target.closest('button')||e.target.id==='fc')){e.preventDefault();flipCard();return}}
 if($('q-play').classList.contains('hidden')||e.target.tagName==='INPUT')return;
 const k='1234'.indexOf(e.key)>=0?'1234'.indexOf(e.key):'abcd'.indexOf(e.key.toLowerCase());
 if(k>=0&&e.key.length===1&&!locked)pick(k);else if(e.key==='Enter'&&locked){e.preventDefault();next()}});
}
</script>
</body>
</html>
